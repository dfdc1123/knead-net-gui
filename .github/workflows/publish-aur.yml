name: Publish AUR package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-aur
  cancel-in-progress: false

jobs:
  publish:
    name: Publish kneadnet-bin
    if: github.event.release.prerelease == false
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Check out the released tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Download and verify AUR release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          node scripts/check-version.mjs --tag "${RELEASE_TAG}"
          version="${RELEASE_TAG#v}"
          deb="kneadnet_${version}_amd64.deb"
          examples="KneadNet-examples-${version}.zip"
          mkdir release-assets
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS \
            --pattern "${deb}" \
            --pattern "${examples}" \
            --dir release-assets
          (
            cd release-assets
            grep -F "  ${deb}" SHA256SUMS > AUR_SHA256SUMS
            grep -F "  ${examples}" SHA256SUMS >> AUR_SHA256SUMS
            sha256sum --check --strict AUR_SHA256SUMS
          )

      - name: Prepare AUR package metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node scripts/prepare-aur-package.mjs \
            --tag "${RELEASE_TAG}" \
            --checksums release-assets/SHA256SUMS \
            --pkgbuild packaging/aur/PKGBUILD \
            --srcinfo packaging/aur/.SRCINFO \
            --out aur-package
          bash -n aur-package/PKGBUILD

      - name: Configure verified AUR SSH access
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${AUR_SSH_PRIVATE_KEY}" ]]; then
            echo "The AUR_SSH_PRIVATE_KEY repository secret is not configured." >&2
            exit 1
          fi
          install -m 700 -d "${RUNNER_TEMP}/aur-ssh"
          printf '%s\n' "${AUR_SSH_PRIVATE_KEY}" > "${RUNNER_TEMP}/aur-ssh/private_key"
          chmod 600 "${RUNNER_TEMP}/aur-ssh/private_key"
          ssh-keyscan -t ed25519 aur.archlinux.org > "${RUNNER_TEMP}/aur-ssh/known_hosts" 2>/dev/null
          actual_fingerprint="$(ssh-keygen -lf "${RUNNER_TEMP}/aur-ssh/known_hosts" | awk '{print $2}')"
          expected_fingerprint="SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
          if [[ "${actual_fingerprint}" != "${expected_fingerprint}" ]]; then
            echo "AUR SSH host key fingerprint mismatch: ${actual_fingerprint}" >&2
            exit 1
          fi

      - name: Push package metadata to AUR
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          export GIT_SSH_COMMAND="ssh -i ${RUNNER_TEMP}/aur-ssh/private_key -o IdentitiesOnly=yes -o UserKnownHostsFile=${RUNNER_TEMP}/aur-ssh/known_hosts"
          git clone ssh://aur@aur.archlinux.org/kneadnet-bin.git aur-repo

          current_version="$(sed -n 's/^pkgver=//p' aur-repo/PKGBUILD)"
          if [[ "${current_version}" == "${version}" ]]; then
            echo "kneadnet-bin ${version} is already present in the AUR."
            exit 0
          fi
          if [[ -n "${current_version}" ]] && [[ "$(printf '%s\n%s\n' "${current_version}" "${version}" | sort --version-sort | tail -n 1)" == "${current_version}" ]]; then
            echo "Refusing to replace newer AUR version ${current_version} with ${version}." >&2
            exit 1
          fi

          install -m 644 aur-package/PKGBUILD aur-repo/PKGBUILD
          install -m 644 aur-package/.SRCINFO aur-repo/.SRCINFO
          git -C aur-repo config user.name "github-actions[bot]"
          git -C aur-repo config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C aur-repo add PKGBUILD .SRCINFO
          if git -C aur-repo diff --cached --quiet; then
            echo "AUR package metadata is already up to date."
            exit 0
          fi
          git -C aur-repo commit -m "Update to ${version}"
          git -C aur-repo push origin HEAD:master
